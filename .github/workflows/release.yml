name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.29"
          python-version: "3.11"
          enable-cache: false
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "v$(uv version --short)"
      - name: Verify release commit belongs to main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::The release tag must point to a commit contained in main"
            exit 1
          fi
      - run: uv sync --locked --dev --no-editable
      - run: uv run --no-editable pytest
      - run: uv run --no-editable testenix pytest -q
      - run: uv run --no-editable ruff check .
      - run: uv run --no-editable ruff format --check .
      - run: uv run --no-editable mypy
      - run: uv run --no-editable pyright --pythonversion 3.11 src/testenix
      - run: uv build --no-sources
      - run: uv run twine check --strict dist/*
      - run: uv run check-wheel-contents dist/*.whl
      - run: uv run --isolated --no-project --with ./dist/testenix-*.whl testenix --version
      - run: uv run --isolated --no-project --with ./dist/testenix-*.whl testenix run examples/basic --no-history
      - name: Verify pytest extra from wheel
        shell: bash
        run: |
          wheel_path="$(realpath "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)")"
          uv run --isolated --no-project --with "testenix[pytest] @ $wheel_path" testenix pytest --version
          uv run --isolated --no-project --with "testenix[pytest] @ $wheel_path" --with "pytest==8.3.0" testenix pytest --version
          uv run --isolated --no-project --with "testenix[pytest] @ $wheel_path" testenix migrate pytest examples/migration_pytest/tests --output .testenix-release-pytest --workers 2
          uv run --isolated --no-project --with "$wheel_path" testenix run .testenix-release-pytest --no-history
          uv run --isolated --no-project --with "$wheel_path" testenix migrate unittest examples/migration_unittest/tests --output .testenix-release-unittest --workers 2
          outside="$(mktemp -d)"
          cd "$outside"
          uv run --isolated --no-project --with "$wheel_path" testenix run "$GITHUB_WORKSPACE/.testenix-release-unittest" --no-history
      - run: uv run --isolated --no-project --with ./dist/testenix-*.tar.gz testenix --version
      - run: uv run --isolated --no-project --with ./dist/testenix-*.tar.gz testenix run examples/basic --no-history
      - name: Verify migration commands from sdist
        shell: bash
        run: |
          sdist_path="$(realpath "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)")"
          uv run --isolated --no-project --with "testenix[pytest] @ $sdist_path" testenix migrate pytest examples/migration_pytest/tests --check --output .testenix-release-sdist-pytest --workers 2
          uv run --isolated --no-project --with "$sdist_path" testenix migrate unittest examples/migration_unittest/tests --check --output .testenix-release-sdist-unittest --workers 2
      - name: Store distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/testenix
    permissions:
      id-token: write # Authenticate to PyPI via Trusted Publishing.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
